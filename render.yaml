services:
  - type: web
    name: nox-backend
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_SSL
        value: true
      - key: DB_POOL_MAX
        value: 10
      - key: DB_POOL_MIN
        value: 0
      - key: DB_POOL_ACQUIRE
        value: 30000
      - key: DB_POOL_IDLE
        value: 10000
      - key: DB_SYNC_ON_START
        value: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: JWT_REFRESH_COOKIE_MAX_AGE_MS
        value: 2592000000
      - key: JSON_BODY_LIMIT
        value: 2mb
      - key: URLENCODED_BODY_LIMIT
        value: 2mb
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 180
      - key: MAX_UPLOAD_SIZE_MB
        value: 8
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false